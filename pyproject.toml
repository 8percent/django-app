[project]
name = "django-app"
version = "1.0.0"
description = "Provide base template for django app package"
authors = [
    { name = "JaeyoungHeo", email = "jay.jaeyoung@gmail.com" },
]
maintainers = [
    { name = "JaeyoungHeo", email = "jay.jaeyoung@gmail.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
]

[project.urls]
repository = "https://github.com/8percent/django-app"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "tox>=4.15,<5",
    "tox-uv>=1.11.0",
    "pytest-cov>=5,<7",
    "ruff>=0.9",
    "pre-commit>=4,<5",
    "pytest-django>=4.9,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_app"]

# Lint & Format Configurations (ruff, aligned with the `eight` conventions)
[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort
select = ["E", "W", "F", "I"]
# E203 conflicts with the formatter's slice handling (matches eight's flake8 config)
extend-ignore = ["E203"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = [
    "tests",
]
DJANGO_SETTINGS_MODULE = "tests.settings"
